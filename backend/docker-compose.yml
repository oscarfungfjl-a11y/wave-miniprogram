# 浪报后端 — Docker Compose 本地开发环境
# 启动: docker-compose up -d
# 停止: docker-compose down

version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: wave-postgres
    environment:
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: wave123
      POSTGRES_DB: wave_report
    ports:
      - "5432:5432"
    volumes:
      - wave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave -d wave_report"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: wave-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  wave_pgdata:
